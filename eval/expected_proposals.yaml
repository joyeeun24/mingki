  - { rule_id: R018, trap: true, reason: "LTV 0.40, 제10조" }
  - { rule_id: R008, trap: true, reason: "정년 65, 제7조" }
  - { rule_id: R005, reason: "고령자 우대 폭 변경 없음" }
  - { rule_id: R013, reason: "고령자 우대 폭 변경 없음" }
  - { rule_id: R019, reason: "고령자 우대 폭 변경 없음" }
  - { rule_id: R014, reason: "변경 없음" }
  - { rule_id: R002, reason: "변경 없음" }
  - { rule_id: R003, reason: "변경 없음" }
  - { rule_id: R016, reason: "변경 없음" }
  - { rule_id: R004, reason: "변경 없음" }
  - { rule_id: R006, reason: "변경 없음" }
  - { rule_id: R009, reason: "표현만 변경" }
  - { rule_id: R012, reason: "상품 자체 기준" }
  - { rule_id: R017, reason: "상품 자체 기준" }

contracts:
