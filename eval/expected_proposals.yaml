# 상품 규칙 제안 정답 (Agent에 노출 금지). 사람이 읽는 설명은 answer_key.md 2~3절.
#
# 채점 규칙
#   changes     : rule_id로 매칭. proposed · unit · effective_from이 모두 같아야 정답
#   new_rules   : rule_key 이름은 보지 않는다. article + value + unit + effective_from으로 매칭.
#                 products의 상품마다 따로 내거나 "전 상품 공통"(product_id: ALL) 1건이면 정답
#   must_not    : 이 rule_id에 낸 제안은 오답 (trap: true는 함정)
#   contracts   : required는 종전 기준 유지로 표시돼야 정답, bonus는 가산, info는 채점 제외

effective_from: "2026-12-01"
close_previous_on: "2026-11-30"
first_new_rule_id: R020

changes:
  - { rule_id: R001, product_id: P001, rule_key: DSR_LIMIT, current: "0.40", proposed: "0.35", unit: ratio, article: "8" }
  - { rule_id: R011, product_id: P002, rule_key: DSR_LIMIT, current: "0.40", proposed: "0.35", unit: ratio, article: "8" }
  - { rule_id: R010, product_id: P002, rule_key: ELIGIBLE_MIN_AGE, current: "65", proposed: "60", unit: age, article: "15" }

new_rules:
  - suggested_rule_key: SENIOR_EXPLANATION_REQUIRED
    products: [P001, P002, P003]
    value: "true"
    unit: bool
    article: "15-2"
    applies_by: contracted_at   # 부칙 제3조. 다른 제안은 applied_at. 저장 컬럼 없이 제안 설명에 표시하면 정답

separate_actions:   # 상품 규칙으로 표현 안 됨. 리포트에 "업무 절차 변경 필요"로 표시
  - { article: "15-2", item: "설명 기록 · 계약 종료 후 5년 보관" }
  - { article: "15-2", item: "확인 전 계약 체결 금지" }

must_not:
