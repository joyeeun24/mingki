    - { contract_id: C0002, article: "15", expected: "기존 계약, 비고령자 유지" }
    - { contract_id: C0004, article: "15", expected: "시행일 전 신청, 종전 기준(비고령자)" }
  bonus:
    - { contract_id: C0006, article: "8", expected: "2027-02 기간 연장 때도 종전 DSR 한도 0.40" }
  info:
